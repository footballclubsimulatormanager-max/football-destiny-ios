workflows:
  ios-workflow:
    name: Football Destiny iOS
    max_build_duration: 60
    integrations:
      app_store_connect: FCSMANAGER
    environment:
      xcode: latest
    scripts:
      - name: Set up signing
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          xcodebuild \
            -project "FootballDestiny.xcodeproj" \
            -scheme "FootballDestiny" \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/FootballDestiny.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=7B535ZNRSR \
            CURRENT_PROJECT_VERSION=$BUILD_NUMBER \
            archive 2>&1

          xcodebuild \
            -exportArchive \
            -archivePath "$CM_BUILD_DIR/FootballDestiny.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$CM_BUILD_DIR/ios/ipa" \
            2>&1
    artifacts:
      - $CM_BUILD_DIR/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
